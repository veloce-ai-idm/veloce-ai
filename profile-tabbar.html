<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Browser</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      font-family: 'Segoe UI', sans-serif;
      color: #c8d6e5;
      height: 100%;
      overflow: hidden;
      background: #0c1220;
      display: flex;
      flex-direction: column;
    }
    #tab-bar {
      display: flex;
      align-items: flex-end;
      padding: 0 6px;
      min-width: 0;
      height: 40px;
      min-height: 40px;
      flex-shrink: 0;
      background: #080e1a;
      border-bottom: 1px solid #1e3a5f;
    }
    #tabs {
      display: flex;
      gap: 2px;
      overflow-x: auto;
      flex: 1;
      min-width: 0;
    }
    #tabs::-webkit-scrollbar { height: 4px; }
    #tabs::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 2px; }
    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0c1220;
      color: #64748b;
      border: 1px solid #1e293b;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      padding: 6px 12px;
      min-width: 80px;
      max-width: 200px;
      cursor: pointer;
      font-size: 12px;
      flex-shrink: 0;
    }
    .tab:hover { background: #141c2e; color: #94a3b8; }
    .tab.active { background: #0f172a; color: #7dd3fc; border-color: #0ea5e9; }
    .tab-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab-close {
      background: none;
      border: none;
      color: #475569;
      cursor: pointer;
      font-size: 14px;
      padding: 0 2px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .tab-close:hover { background: #dc2626; color: #fff; }
    #btn-new-tab {
      background: #0c1220;
      color: #0ea5e9;
      border: 1px solid #1e3a5f;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      width: 28px;
      height: 28px;
      cursor: pointer;
      margin-left: 4px;
      margin-bottom: 2px;
      flex-shrink: 0;
    }
    #btn-new-tab:hover { background: #1e3a5f; color: #fff; }
    #content {
      flex: 1;
      min-height: 0;
      position: relative;
    }
    #content iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: #fff;
    }
    #content iframe.active { display: block; }
  </style>
</head>
<body>
  <div id="tab-bar">
    <div id="tabs"></div>
    <button id="btn-new-tab" title="New tab">+</button>
  </div>
  <div id="content"></div>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var startUrl = params.get('startUrl') || 'https://www.google.com';
      var defaultStartUrl = 'https://www.google.com';

      var tabs = [];
      var activeIndex = 0;
      var tabsEl = document.getElementById('tabs');
      var contentEl = document.getElementById('content');

      function tabTitle(url) {
        if (!url || url === 'about:blank') return 'New Tab';
        try {
          var u = new URL(url);
          var host = u.hostname.replace(/^www\./, '');
          return host.length > 25 ? host.slice(0, 22) + '…' : host;
        } catch (e) { return 'New Tab'; }
      }

      function createTab(url, focus) {
        url = url || defaultStartUrl;
        var id = 'tab-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
        var iframe = document.createElement('iframe');
        iframe.id = id;
        iframe.setAttribute('data-tab-id', id);
        iframe.src = url;

        var tabEl = document.createElement('div');
        tabEl.className = 'tab';
        tabEl.setAttribute('data-tab-id', id);
        var titleSpan = document.createElement('span');
        titleSpan.className = 'tab-title';
        titleSpan.textContent = tabTitle(url);
        var closeBtn = document.createElement('button');
        closeBtn.className = 'tab-close';
        closeBtn.textContent = '×';
        closeBtn.onclick = function(e) { e.stopPropagation(); closeTab(id); };

        tabEl.appendChild(titleSpan);
        tabEl.appendChild(closeBtn);
        tabEl.onclick = function(e) { if (!e.target.classList.contains('tab-close')) switchToTab(id); };

        tabsEl.appendChild(tabEl);
        contentEl.appendChild(iframe);

        iframe.addEventListener('load', function() {
          var t = tabs.find(function(x) { return x.id === id; });
          if (t) {
            try {
              t.title = iframe.contentDocument && iframe.contentDocument.title ? iframe.contentDocument.title : tabTitle(t.url);
            } catch (e) { t.title = tabTitle(t.url); }
            titleSpan.textContent = (t.title && t.title.length > 25) ? t.title.slice(0, 25) + '…' : (t.title || tabTitle(t.url));
          }
        });

        tabs.push({ id: id, url: url, title: tabTitle(url), tabEl: tabEl, titleSpan: titleSpan, iframe: iframe });
        if (focus !== false) switchToTab(id);
        return id;
      }

      function switchToTab(id) {
        var idx = tabs.findIndex(function(t) { return t.id === id; });
        if (idx === -1) return;
        activeIndex = idx;
        tabs.forEach(function(t, i) {
          if (i === idx) {
            t.iframe.classList.add('active');
            t.tabEl.classList.add('active');
          } else {
            t.iframe.classList.remove('active');
            t.tabEl.classList.remove('active');
          }
        });
      }

      function closeTab(id) {
        var idx = tabs.findIndex(function(t) { return t.id === id; });
        if (idx === -1) return;
        if (tabs.length <= 1) {
          createTab(defaultStartUrl);
          return;
        }
        var t = tabs[idx];
        t.tabEl.remove();
        t.iframe.remove();
        tabs.splice(idx, 1);
        if (activeIndex >= tabs.length) activeIndex = tabs.length - 1;
        else if (idx < activeIndex) activeIndex--;
        switchToTab(tabs[activeIndex].id);
      }

      document.getElementById('btn-new-tab').onclick = function() { createTab(defaultStartUrl); };

      createTab(startUrl, true);
    })();
  </script>
</body>
</html>
